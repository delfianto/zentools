[package]
name = "zentools-gui"
version = "0.3.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT"

[dependencies]
zentools = { path = "..", default-features = false }
cxx = "1"
cxx-qt = "=0.10.0"
cxx-qt-lib = { version = "=0.10.0", features = ["qt_full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cxx-qt-build = "=0.10.0"
